name: CI

# Continuous integration for Ledger.
# Runs the correctness gates on every push to the main branches and on pull
# requests. These are the same gates used locally: debug + release Kotlin
# compilation and the JVM unit-test suite (which includes the bank-SMS corpus
# regression suite). Release signing is skipped automatically when
# keystore.properties is absent (see app/build.gradle.kts), so no secrets are
# required for these jobs.

on:
  push:
    branches: [main, develop, feature/ldl-foundation]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # gradlew's executable bit is now fixed in git (2026-08-06), but this
      # runs anyway in case a future commit from a Windows checkout drops it
      # again — Windows/git routinely fails to preserve +x. Root cause of
      # every CI run failing on this repo up to that date.
      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Compile release variant
        run: ./gradlew --no-daemon compileReleaseKotlin

      - name: Debug compile + unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
